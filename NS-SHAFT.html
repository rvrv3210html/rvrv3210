<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>小朋友下樓梯 - 重製版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@700&display=swap');

        body {
            font-family: 'Press Start 2P', 'Noto Sans TC', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 遊戲畫布陰影與外框 */
        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
            border: 4px solid #3b82f6;
            border-radius: 12px;
            overflow: hidden;
            max-height: 90vh;
            max-width: 100vw;
            aspect-ratio: 2 / 3;
        }

        canvas {
            display: block;
            background: #020617;
            width: 100%;
            height: 100%;
        }

        /* 經典復古按鈕懸浮效果 */
        .btn-retro {
            transition: all 0.1s ease;
            box-shadow: 0 6px 0 #1e40af;
        }
        .btn-retro:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1e40af;
        }

        /* 手機按鍵按壓效果 */
        .touch-btn:active {
            background-color: rgba(255, 255, 255, 0.25);
        }

        .inventory-slot {
            width: 36px;
            height: 36px;
            border: 2px solid #475569;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .inventory-slot:hover {
            border-color: #38bdf8;
            transform: scale(1.05);
        }
        .inventory-slot:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4">

    <!-- 主遊戲區域包裝器 -->
    <div id="game-container" class="relative bg-slate-900 flex flex-col items-center">
        
        <!-- 頂部資訊列 (UI Header) -->
        <div class="absolute top-0 left-0 w-full p-2 sm:p-3 bg-slate-950/80 backdrop-blur-md flex justify-between items-center z-10 border-b border-slate-800 text-xs sm:text-sm">
            <!-- 生命值條 -->
            <div class="flex items-center space-x-2">
                <span class="text-red-400 font-bold text-xs">HP</span>
                <div class="w-24 sm:w-36 h-3.5 bg-slate-800 rounded-full border border-slate-700 overflow-hidden p-0.5">
                    <div id="hp-bar" class="h-full bg-gradient-to-r from-red-600 via-yellow-500 to-green-500 rounded-full transition-all duration-200" style="width: 100%;"></div>
                </div>
                <span id="hp-text" class="text-[10px] sm:text-xs text-slate-300 font-mono">10/10</span>
            </div>

            <!-- 3 格物品欄 (Inventory) -->
            <div class="flex items-center space-x-1.5 bg-slate-900/90 p-1 rounded-lg border border-slate-700/60">
                <div id="slot-0" class="inventory-slot text-xs" onclick="useInventoryItem(0)" title="點擊使用道具 1"></div>
                <div id="slot-1" class="inventory-slot text-xs" onclick="useInventoryItem(1)" title="點擊使用道具 2"></div>
                <div id="slot-2" class="inventory-slot text-xs" onclick="useInventoryItem(2)" title="點擊使用道具 3"></div>
            </div>
            
            <!-- 目前深度 / 分數 -->
            <div class="flex items-center space-x-4">
                <div class="text-sky-400 font-bold text-xs sm:text-sm">
                    <span class="text-slate-400 text-[10px]">FLOOR:</span> 
                    <span id="depth-text" class="text-amber-400">B0</span>
                </div>
            </div>
        </div>

        <!-- 遊戲 Canvas -->
        <canvas id="gameCanvas" width="400" height="600" class="max-w-full h-auto"></canvas>

        <!-- 開始畫面 Overlay -->
        <div id="start-screen" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-6 z-20 text-center">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-sky-300 to-emerald-400 mb-2 tracking-wider">
                小朋友下樓梯重製版
            </h1>
            <p class="text-xs text-slate-400 mb-8 font-mono">NS-SHAFT RETRO EDITION</p>

            <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800 mb-8 max-w-xs text-left text-xs space-y-2 text-slate-300">
                <p class="text-amber-400 font-bold text-center mb-2">🎮 操作說明</p>
                <p>• <span class="text-sky-400 font-bold">← / →</span> 或 <span class="text-sky-400 font-bold">A / D</span>：左右移動</p>
                <p>• 避開 <span class="text-red-400">尖刺階梯</span> 與 <span class="text-slate-400">頂部天花板刺</span></p>
                <p>• <span class="text-purple-400">黏液膠水板</span> 定身 1~3 秒（踩一次後變普通板；碰到頂刺可解困）</p>                <p>• 點擊滑鼠或按鍵盤 <span class="text-amber-300 font-bold">1 / 2 / 3</span> 使用對應道具！</p>
                <!-- <p>• <span class="text-green-400">生 (生命藥水)</span>: 30% 機率 (+1~5 HP)</p>
                <p>• <span class="text-yellow-300">加 (加速藥水)</span>: 55% 機率 (提升移動速度 5 秒)</p>
                <p>• <span class="text-purple-300">解 (解困藥水)</span>: 15% 機率 (瞬間解除困住)</p> -->
                <p class="text-emerald-400 font-bold mt-1">NS-SHAFT Web Edition • HTML5 Canvas Game</p>
            </div>

            <div class="text-xs text-slate-400 mb-6">
                最高紀錄：<span id="high-score-start" class="text-amber-400 font-bold">B0</span>
            </div>

            <button id="start-btn" class="btn-retro bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-lg border-2 border-blue-400 text-sm tracking-wider">
                開始遊戲
            </button>
        </div>

        <!-- 遊戲結束畫面 Overlay -->
        <div id="game-over-screen" class="absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center p-6 z-20 text-center hidden">
            <h2 class="text-3xl font-extrabold text-red-500 mb-2 animate-bounce">GAME OVER</h2>
            <p id="game-over-reason" class="text-xs text-slate-400 mb-6">掉落到底部深淵了！</p>

            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 mb-6 w-64 space-y-3">
                <div>
                    <div class="text-xs text-slate-400">本次成績</div>
                    <div id="final-depth" class="text-2xl font-bold text-amber-400">B0</div>
                </div>
                <div class="border-t border-slate-800 pt-2">
                    <div class="text-xs text-slate-400">歷史最高</div>
                    <div id="high-score-end" class="text-lg font-bold text-sky-400">B0</div>
                </div>
            </div>

            <button id="restart-btn" class="btn-retro bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-8 rounded-lg border-2 border-emerald-400 text-sm tracking-wider">
                再玩一次
            </button>
        </div>

        <!-- 手機端觸控按鈕 (自動在移動設備顯示) -->
        <div id="touch-controls" class="absolute bottom-0 left-0 w-full h-32 flex justify-between pointer-events-none md:hidden z-10">
            <div id="btn-left" class="touch-btn w-1/2 h-full bg-white/5 border-r border-white/10 flex items-center justify-center pointer-events-auto active:bg-white/20 transition-colors">
                <span class="text-3xl opacity-40">◀</span>
            </div>
            <div id="btn-right" class="touch-btn w-1/2 h-full bg-white/5 flex items-center justify-center pointer-events-auto active:bg-white/20 transition-colors">
                <span class="text-3xl opacity-40">▶</span>
            </div>
        </div>
    </div>

    <!-- 頁腳資訊 -->
    <!-- <footer class="mt-4 text-xs text-slate-500 text-center">
        NS-SHAFT Web Edition • HTML5 Canvas Game
    </footer> -->

    <script>
        /**
         * Web Audio API 音效合成器
         * 無須外部音訊檔案，直接以程式碼合成復古 8-bit 音效
         */
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playJump() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playHurt() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(80, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playHeal() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playSpring() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }

            playBreak() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(30, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playTeleport() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playItem() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1000, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }
        }

        const soundFX = new SoundFX();

        // 遊戲核心常數
        const CANVAS_WIDTH = 400;
        const CANVAS_HEIGHT = 600;
        const MAX_HP = 10;
        const CEILING_SPIKE_HEIGHT = 30;

        // Platform 種類列舉
        const PLATFORM_TYPES = {
            NORMAL: 'NORMAL',
            SPIKE: 'SPIKE',
            CONVEYOR_LEFT: 'CONVEYOR_LEFT',
            CONVEYOR_RIGHT: 'CONVEYOR_RIGHT',
            SPRING: 'SPRING',
            CRUMBLE: 'CRUMBLE',
            TRAP: 'TRAP'
        };

        // 道具種類列舉
        const ITEM_TYPES = {
            HEAL: 'HEAL',         // 恢復生命藥水 (1-5 HP)
            UNTRAP: 'UNTRAP',     // 解除困住藥水
            SPEED: 'SPEED'        // 加速藥水
        };

        // 取得 HTML 元素
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const hpBar = document.getElementById('hp-bar');
        const hpText = document.getElementById('hp-text');
        const depthText = document.getElementById('depth-text');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const finalDepthText = document.getElementById('final-depth');
        const highScoreStartText = document.getElementById('high-score-start');
        const highScoreEndText = document.getElementById('high-score-end');
        const gameOverReason = document.getElementById('game-over-reason');

        // 手機觸控區域
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');

        // 遊戲狀態變數
        let isGameRunning = false;
        let animationFrameId = null;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('ns_shaft_highscore') || '0', 10);
        let platformSpeed = 2.0;
        let lastPlatformY = CANVAS_HEIGHT;
        let lastPlatformX = CANVAS_WIDTH / 2 - 40;
        let lastLandedPlatform = null;

        // 3 格物品欄 (Inventory)
        let inventory = [null, null, null];

        // 輸入狀態
        const keys = {
            left: false,
            right: false,
            up: false
        };

        // 玩家角色物件
        const player = {
            x: 190,
            y: 100,
            width: 24,
            height: 30,
            vx: 0,
            vy: 0,
            baseSpeed: 4.5,
            speed: 4.5,
            gravity: 0.4,
            maxFallSpeed: 8,
            hp: MAX_HP,
            isGrounded: false,
            facing: 'right',
            hurtTimer: 0, 
            trapTimer: 0, 
            trapMaxTime: 0, 
            speedBuffTimer: 0, // 加速Buff計時器
            animFrame: 0,
            touchingCeilingSpike: false, // 紀錄是否正處於接觸頂刺狀態（防止連續扣血）
            touchingSpikePlatform: null,  // 紀錄目前正踩著的針刺階梯（離開再踩才會重新扣血）

            reset() {
                this.x = CANVAS_WIDTH / 2 - 12;
                this.y = 100;
                this.vx = 0;
                this.vy = 0;
                this.speed = this.baseSpeed;
                this.hp = MAX_HP;
                this.isGrounded = false;
                this.facing = 'right';
                this.hurtTimer = 0;
                this.trapTimer = 0;
                this.trapMaxTime = 0;
                this.speedBuffTimer = 0;
                this.touchingCeilingSpike = false;
                this.touchingSpikePlatform = null;
            },

            update() {
                // 加速藥水效果處理
                if (this.speedBuffTimer > 0) {
                    this.speedBuffTimer--;
                    this.speed = this.baseSpeed * 1.5; // 移動速度提升 50%
                } else {
                    this.speed = this.baseSpeed;
                }

                // 困住計時器更新
                if (this.trapTimer > 0) {
                    this.trapTimer--;
                }

                // 水平移動 (僅當【沒有被困住】時響應玩家鍵盤輸入)
                if (this.trapTimer > 0) {
                    this.vx = 0;
                } else {
                    let moveInput = 0;
                    if (keys.left) moveInput -= 1;
                    if (keys.right) moveInput += 1;

                    if (moveInput < 0) {
                        this.vx = -this.speed;
                        this.facing = 'left';
                    } else if (moveInput > 0) {
                        this.vx = this.speed;
                        this.facing = 'right';
                    } else {
                        this.vx = 0;
                    }
                }

                this.x += this.vx;

                // 邊界限制
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > CANVAS_WIDTH) this.x = CANVAS_WIDTH - this.width;

                // 重力與垂直移動
                this.vy += this.gravity;
                if (this.vy > this.maxFallSpeed) this.vy = this.maxFallSpeed;
                this.y += this.vy;

                // 受傷閃爍計時器
                if (this.hurtTimer > 0) {
                    this.hurtTimer--;
                }

                // 【嚴格限制】：只有在被困住 (trapTimer > 0) 時才更新上下擺動影格
                if (this.trapTimer > 0) {
                    this.animFrame += 0.3;
                } else {
                    this.animFrame = 0; // 未被困住時強制擺動歸零
                }
            },

            draw(ctx) {
                // 受傷閃爍效果 (每幾幀隱藏一次)
                if (this.hurtTimer > 0 && Math.floor(this.hurtTimer / 4) % 2 === 0) {
                    return;
                }

                ctx.save();

                // 【極致嚴格】：確定只在困住狀態下有 bounceY 擺動位移，平常一律為 0
                const bounceY = this.trapTimer > 0 ? Math.sin(this.animFrame) * 3 : 0;
                const drawY = this.y + bounceY;
                
                // 加速狀態光軌/殘影特效
                if (this.speedBuffTimer > 0 && Math.abs(this.vx) > 0) {
                    ctx.fillStyle = 'rgba(251, 191, 36, 0.3)';
                    ctx.fillRect(this.x - (this.vx * 2), drawY + 10, this.width, this.height - 10);
                }

                // 玩家主體顏色
                ctx.fillStyle = this.speedBuffTimer > 0 ? '#f59e0b' : '#38bdf8'; // 加速時亮黃，平時亮藍
                ctx.fillRect(this.x, drawY + 10, this.width, this.height - 10);

                // 頭部/皮膚
                ctx.fillStyle = '#ffed4a'; // 經典黃色圓頭
                ctx.beginPath();
                ctx.arc(this.x + this.width / 2, drawY + 8, 9, 0, Math.PI * 2);
                ctx.fill();

                // 眼睛
                ctx.fillStyle = '#0f172a';
                const eyeOffset = this.facing === 'right' ? 3 : -3;
                ctx.fillRect(this.x + this.width / 2 + eyeOffset, drawY + 6, 3, 4);

                // 腿部
                ctx.fillStyle = '#0284c7';
                ctx.fillRect(this.x + 3, drawY + this.height - 4, 6, 4);
                ctx.fillRect(this.x + 15, drawY + this.height - 4, 6, 4);

                // 繪製困住特效 (黏液包覆與標示)
                if (this.trapTimer > 0) {
                    // 腳下黏液蛛網/膠水
                    ctx.fillStyle = 'rgba(168, 85, 247, 0.7)';
                    ctx.beginPath();
                    ctx.ellipse(this.x + this.width / 2, this.y + this.height - 2, 14, 6, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // 頭頂 TRAPPED 標記
                    ctx.font = '9px "Press Start 2P", monospace';
                    ctx.fillStyle = '#c084fc';
                    ctx.textAlign = 'center';
                    ctx.fillText('TRAPPED!', this.x + this.width / 2, drawY - 10);

                    // 倒數計時小進度條
                    const progress = this.trapTimer / this.trapMaxTime;
                    ctx.fillStyle = '#581c87';
                    ctx.fillRect(this.x - 2, drawY - 20, this.width + 4, 3);
                    ctx.fillStyle = '#c084fc';
                    ctx.fillRect(this.x - 2, drawY - 20, (this.width + 4) * progress, 3);
                }

                ctx.restore();
            }
        };

        // 道具物件類別
        class Item {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.width = 16;
                this.height = 20;
                this.type = type;
                this.markedForDeletion = false;
                this.floatOffset = 0;
                
                // 恢復生命藥水數值計算 (1~3 HP，機率分別為 80%, 16%, 4%)
                if (this.type === ITEM_TYPES.HEAL) {
                    const r = Math.random();
                    if (r < 0.80) this.healAmount = 1;      // 80% 機率 +1 HP
                    else if (r < 0.96) this.healAmount = 2; // 16% 機率 +2 HP
                    else this.healAmount = 3;               // 4% 機率 +3 HP
                }
            }

            update() {
                this.y -= platformSpeed; // 隨平台一同向上上升
                this.floatOffset += 0.08;

                if (this.y + this.height < 0) {
                    this.markedForDeletion = true;
                }
            }

            draw(ctx) {
                ctx.save();
                const drawY = this.y + Math.sin(this.floatOffset) * 3;

                // 瓶身外框/外發光
                ctx.shadowBlur = 6;

                if (this.type === ITEM_TYPES.HEAL) {
                    // 生命藥水外觀統一為鮮紅色
                    ctx.shadowColor = '#ef4444';
                    
                    // 瓶口
                    ctx.fillStyle = '#e2e8f0';
                    ctx.fillRect(this.x + 5, drawY, 6, 4);
                    // 瓶身
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath();
                    ctx.arc(this.x + 8, drawY + 12, 7, 0, Math.PI * 2);
                    ctx.fill();

                    // 數字標籤 (+1 ~ +5)
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 9px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(`+${this.healAmount}`, this.x + 8, drawY + 15);

                } else if (this.type === ITEM_TYPES.UNTRAP) {
                    // 解除困住藥水 (紫色閃耀瓶裝水)
                    ctx.shadowColor = '#c084fc';
                    ctx.fillStyle = '#e2e8f0';
                    ctx.fillRect(this.x + 5, drawY, 6, 4);
                    ctx.fillStyle = '#a855f7';
                    ctx.fillRect(this.x + 3, drawY + 4, 10, 12);
                    // 星星閃光 symbol
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText('✨', this.x + 1, drawY + 14);

                } else if (this.type === ITEM_TYPES.SPEED) {
                    // 加速藥水 (黃色風暴藥水)
                    ctx.shadowColor = '#fde047';
                    ctx.fillStyle = '#e2e8f0';
                    ctx.fillRect(this.x + 5, drawY, 6, 4);
                    ctx.fillStyle = '#eab308';
                    ctx.beginPath();
                    ctx.moveTo(this.x + 8, drawY + 4);
                    ctx.lineTo(this.x + 15, drawY + 16);
                    ctx.lineTo(this.x + 1, drawY + 16);
                    ctx.closePath();
                    ctx.fill();
                    // 閃電標誌
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText('⚡', this.x + 2, drawY + 14);
                }

                ctx.restore();
            }
        }

        // 階梯與道具陣列
        let platforms = [];
        let items = [];
        let lastSpawnY = CANVAS_HEIGHT; 

        /**
         * 隨機取得階梯種類
         */
        function getRandomPlatformType() {
            const rand = Math.random();
            if (rand < 0.40) {
                return PLATFORM_TYPES.NORMAL;         // 40% 普通階梯
            } else if (rand < 0.55) {
                return PLATFORM_TYPES.SPIKE;          // 15% 針刺階梯
            } else if (rand < 0.70) {
                return PLATFORM_TYPES.CONVEYOR_LEFT;  // 15% 左輸送帶
            } else if (rand < 0.82) {
                return PLATFORM_TYPES.CONVEYOR_RIGHT; // 12% 右輸送帶
            } else if (rand < 0.90) {
                return PLATFORM_TYPES.SPRING;         // 8% 彈簧階梯
            } else if (rand < 0.95) {
                return PLATFORM_TYPES.CRUMBLE;        // 5% 易碎階梯
            } else {
                return PLATFORM_TYPES.TRAP;           // 5% 黏液困住階梯
            }
        }

        // 階梯類別
        class Platform {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.width = 90;
                this.height = 14;
                this.type = type;
                this.markedForDeletion = false;
                this.isCrumbled = false;
                this.crumbleTimer = 0;
                this.springState = 0; // 0: 正常, >0: 彈跳動畫中
                this.conveyorAnim = 0;
                this.hasLanded = false;
            }

            update() {
                this.y -= platformSpeed;
                if (this.y + this.height < 0) {
                    this.markedForDeletion = true;
                }

                if (this.type === PLATFORM_TYPES.CONVEYOR_LEFT || this.type === PLATFORM_TYPES.CONVEYOR_RIGHT) {
                    this.conveyorAnim = (this.conveyorAnim + 0.3) % 10;
                }

                if (this.springState > 0) {
                    this.springState--;
                }

                if (this.isCrumbled) {
                    this.crumbleTimer++;
                    if (this.crumbleTimer > 12) {
                        this.markedForDeletion = true;
                    }
                }
            }

            draw(ctx) {
                if (this.isCrumbled) return; // 碎裂消退

                ctx.save();

                switch (this.type) {
                    case PLATFORM_TYPES.NORMAL:
                        // 普通金屬階梯
                        ctx.fillStyle = '#475569';
                        ctx.fillRect(this.x, this.y, this.width, this.height);
                        ctx.fillStyle = '#94a3b8';
                        ctx.fillRect(this.x, this.y, this.width, 3);
                        ctx.fillStyle = '#1e293b';
                        ctx.fillRect(this.x, this.y + this.height - 3, this.width, 3);
                        break;

                    case PLATFORM_TYPES.SPIKE:
                        // 針刺階梯
                        ctx.fillStyle = '#64748b';
                        ctx.fillRect(this.x, this.y + 6, this.width, this.height - 6);
                        ctx.fillStyle = '#ef4444';
                        const spikeCount = 6;
                        const spikeW = this.width / spikeCount;
                        for (let i = 0; i < spikeCount; i++) {
                            ctx.beginPath();
                            ctx.moveTo(this.x + i * spikeW, this.y + 6);
                            ctx.lineTo(this.x + (i + 0.5) * spikeW, this.y - 2);
                            ctx.lineTo(this.x + (i + 1) * spikeW, this.y + 6);
                            ctx.closePath();
                            ctx.fill();
                        }
                        break;

                    case PLATFORM_TYPES.CONVEYOR_LEFT:
                        // 向左滾輪輸送帶
                        ctx.fillStyle = '#0f766e';
                        ctx.fillRect(this.x, this.y, this.width, this.height);
                        ctx.fillStyle = '#2dd4bf';
                        ctx.fillRect(this.x, this.y, this.width, 2);
                        // 繪製轉向箭頭/齒輪刻度
                        ctx.fillStyle = '#115e59';
                        for (let i = 0; i < this.width; i += 12) {
                            const offset = (i - this.conveyorAnim + 120) % this.width;
                            ctx.fillRect(this.x + offset, this.y + 3, 5, this.height - 6);
                        }
                        break;

                    case PLATFORM_TYPES.CONVEYOR_RIGHT:
                        // 向右滾輪輸送帶
                        ctx.fillStyle = '#0369a1';
                        ctx.fillRect(this.x, this.y, this.width, this.height);
                        ctx.fillStyle = '#38bdf8';
                        ctx.fillRect(this.x, this.y, this.width, 2);
                        // 繪製轉向箭頭/齒輪刻度
                        ctx.fillStyle = '#075985';
                        for (let i = 0; i < this.width; i += 12) {
                            const offset = (i + this.conveyorAnim) % this.width;
                            ctx.fillRect(this.x + offset, this.y + 3, 5, this.height - 6);
                        }
                        break;

                    case PLATFORM_TYPES.SPRING:
                        // 彈簧高跳階梯
                        ctx.fillStyle = '#d97706';
                        ctx.fillRect(this.x, this.y + 8, this.width, 6);
                        const compress = this.springState > 0 ? 5 : 0;
                        ctx.fillStyle = '#fbbf24';
                        ctx.fillRect(this.x + 4, this.y + 2 + compress, this.width - 8, 6);
                        // 彈簧線圈
                        ctx.strokeStyle = '#f59e0b';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(this.x + 20, this.y + 8);
                        ctx.lineTo(this.x + 35, this.y + 2 + compress);
                        ctx.lineTo(this.x + 50, this.y + 8);
                        ctx.lineTo(this.x + 70, this.y + 2 + compress);
                        ctx.stroke();
                        break;

                    case PLATFORM_TYPES.CRUMBLE:
                        // 易碎階梯
                        ctx.fillStyle = '#854d0e';
                        ctx.fillRect(this.x, this.y, this.width, this.height);
                        ctx.fillStyle = '#ca8a04';
                        // 木紋裂縫線條
                        ctx.fillRect(this.x + 10, this.y + 4, 25, 2);
                        ctx.fillRect(this.x + 45, this.y + 8, 30, 2);
                        break;

                    case PLATFORM_TYPES.TRAP:
                        // 黏液/膠水困住階梯
                        ctx.fillStyle = '#581c87';
                        ctx.fillRect(this.x, this.y, this.width, this.height);
                        ctx.fillStyle = '#a855f7';
                        ctx.fillRect(this.x, this.y, this.width, 3);
                        // 黏液泡泡
                        ctx.fillStyle = '#c084fc';
                        ctx.beginPath();
                        ctx.arc(this.x + 15, this.y + 7, 3, 0, Math.PI * 2);
                        ctx.arc(this.x + 45, this.y + 6, 4, 0, Math.PI * 2);
                        ctx.arc(this.x + 75, this.y + 8, 2, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                }

                ctx.restore();
            }
        }

        // 天花板刺繪製
        function drawCeilingSpikes(ctx) {
            ctx.save();
            const spikeWidth = 20;
            const count = Math.ceil(CANVAS_WIDTH / spikeWidth);

            // 金屬底座
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, CANVAS_WIDTH, 6);

            // 頂部金屬紅銀刺
            for (let i = 0; i < count; i++) {
                ctx.fillStyle = i % 2 === 0 ? '#ef4444' : '#94a3b8';
                ctx.beginPath();
                ctx.moveTo(i * spikeWidth, 6);
                ctx.lineTo((i + 0.5) * spikeWidth, CEILING_SPIKE_HEIGHT);
                ctx.lineTo((i + 1) * spikeWidth, 6);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();
        }

        // 階梯生成機制
        function generatePlatforms() {
            // 保持階梯垂直間距 (約 75px)
            const minSpacing = 75;
            
            // 取得最新生成的階梯 Y 座標（若陣列為空則以畫布底部為基準）
            let highestPlatformY = platforms.length > 0 
                ? platforms[platforms.length - 1].y 
                : CANVAS_HEIGHT;

            // 當畫面下方有空間時，持續補充新階梯
            if (highestPlatformY < CANVAS_HEIGHT + minSpacing) {
                const y = highestPlatformY + minSpacing;
                
                // 決定是否在同一 Y 軸產生雙板 (15% 機率)
                const isDoublePlatform = Math.random() < 0.15;

                if (isDoublePlatform) {
                    // 生成左右各一塊較小階梯
                    const p1 = new Platform(15 + Math.random() * 80, y, getRandomPlatformType());
                    const p2 = new Platform(215 + Math.random() * 80, y, getRandomPlatformType());
                    platforms.push(p1, p2);

                    trySpawnItem(p1);
                    trySpawnItem(p2);
                } else {
                    // 單一階梯，控制 X 軸不與上一塊階梯相差過遠
                    let x = lastPlatformX + (Math.random() * 160 - 80);
                    if (x < 10) x = 10;
                    if (x > CANVAS_WIDTH - 100) x = CANVAS_WIDTH - 100;

                    const p = new Platform(x, y, getRandomPlatformType());
                    platforms.push(p);
                    lastPlatformX = x;

                    trySpawnItem(p);
                }
            }
        }

        // 道具生成 logic
        function trySpawnItem(platform) {
            if (platform.type === PLATFORM_TYPES.SPIKE) return; // 針刺板不生成道具

            if (Math.random() < 0.30) { // 30% 機率產生道具
                const itemX = platform.x + platform.width / 2 - 8;
                const itemY = platform.y - 25;

                const rand = Math.random();
                let itemType = ITEM_TYPES.HEAL;

                // 生: 30%, 解: 15%, 加: 55%
                if (rand < 0.30) {
                    itemType = ITEM_TYPES.HEAL;   // 30% 機率生命藥水 (生)
                } else if (rand < 0.45) {
                    itemType = ITEM_TYPES.UNTRAP; // 15% 機率解困藥水 (解)
                } else {
                    itemType = ITEM_TYPES.SPEED;  // 55% 機率加速藥水 (加)
                }

                items.push(new Item(itemX, itemY, itemType));
            }
        }

        // 碰撞與踩踏 logic
        function handleCollisions() {
            player.isGrounded = false;

            // 1. 玩家與頂部天花板刺碰撞
            if (player.y <= CEILING_SPIKE_HEIGHT) {
                // 只有從「沒碰到」變成「碰到」的瞬間才算一次傷害與傳送
                if (!player.touchingCeilingSpike) {
                    player.touchingCeilingSpike = true;
                    player.hp -= 3;
                    player.hurtTimer = 30;

                    // 若玩家正處於困住狀態，碰到頂刺立即可破除困住
                    if (player.trapTimer > 0) {
                        player.trapTimer = 0;
                    }

                    soundFX.playHurt();
                    updateUI();

                    if (player.hp <= 0) {
                        endGame('被頂部尖刺刺穿了！');
                        return;
                    }

                    // 傳送到最上面的第 3 塊階梯 (從上到下排序)
                    const validPlatforms = platforms
                        .filter(p => !p.isCrumbled && p.y > CEILING_SPIKE_HEIGHT + 10)
                        .sort((a, b) => a.y - b.y); // 按 Y 軸升序排序 (最上方在第一位)

                    if (validPlatforms.length > 0) {
                        // 選擇第 3 塊 (索引 2)，若不到 3 塊則取最後一塊
                        const targetPlatform = validPlatforms[Math.min(2, validPlatforms.length - 1)];
                        player.x = targetPlatform.x + targetPlatform.width / 2 - player.width / 2;
                        player.y = targetPlatform.y - player.height;
                        player.vy = 0;
                        soundFX.playTeleport();
                    } else {
                        player.y = CEILING_SPIKE_HEIGHT + 2;
                        player.vy = 2;
                    }
                }
            } else {
                // 離開頂部刺，恢復觸碰狀態
                player.touchingCeilingSpike = false;
            }

            // 2. 玩家與階梯碰撞
            let currentlyOnSpikePlatform = null;

            for (let p of platforms) {
                if (p.isCrumbled) continue;

                // 檢查腳底是否落在階梯表面
                const playerFeet = player.y + player.height;
                const prevPlayerFeet = playerFeet - player.vy;

                if (
                    player.x + player.width > p.x &&
                    player.x < p.x + p.width &&
                    prevPlayerFeet <= p.y + 4 &&
                    playerFeet >= p.y &&
                    player.vy >= 0
                ) {
                    // 成功踩在階梯上
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.isGrounded = true;

                    // 踩到普通階梯：加 1 分 & 恢復 1 HP
                    if (!p.hasLanded) {
                        p.hasLanded = true;
                        if (p.type === PLATFORM_TYPES.NORMAL) {
                            score += 1; // 踩普通板 +1 分
                            soundFX.playHeal();
                            updateUI();
                        }
                    }

                    // 依據不同階梯類型執行特殊效果
                    switch (p.type) {
                        case PLATFORM_TYPES.SPIKE:
                            currentlyOnSpikePlatform = p;
                            // 只在「新踏上」這塊針刺階梯時扣血一次
                            if (player.touchingSpikePlatform !== p) {
                                player.touchingSpikePlatform = p;
                                player.hp -= 3;
                                player.hurtTimer = 30;
                                soundFX.playHurt();
                                updateUI();
                                if (player.hp <= 0) {
                                    endGame('踩到針刺階梯失血過多！');
                                    return;
                                }
                            }
                            break;

                        case PLATFORM_TYPES.CONVEYOR_LEFT:
                            // 輸送帶帶動玩家向左移動
                            player.x -= 2.5;
                            break;

                        case PLATFORM_TYPES.CONVEYOR_RIGHT:
                            // 輸送帶帶動玩家向右移動
                            player.x += 2.5;
                            break;

                        case PLATFORM_TYPES.SPRING:
                            // 彈簧板高跳
                            p.springState = 8;
                            player.vy = -10;
                            soundFX.playSpring();
                            break;

                        case PLATFORM_TYPES.CRUMBLE:
                            // 易碎板踏上後崩解
                            if (!p.isCrumbled) {
                                p.isCrumbled = true;
                                soundFX.playBreak();
                            }
                            break;

                        case PLATFORM_TYPES.TRAP:
                            // 黏液膠水困住階梯 (定身 1~3 秒)
                            if (player.trapTimer <= 0) {
                                const randomFrames = Math.floor(60 + Math.random() * 120); // 1~3 秒 (60~180 fps)
                                player.trapTimer = randomFrames;
                                player.trapMaxTime = randomFrames;
                                
                                // 踩中觸發困住後，立刻轉變為普通階梯
                                p.type = PLATFORM_TYPES.NORMAL;
                            }
                            break;
                    }
                }
            }

            // 更新是否處於針刺板上
            player.touchingSpikePlatform = currentlyOnSpikePlatform;

            // 3. 玩家與道具碰撞 (撿起存入 3 格物品欄)
            for (let item of items) {
                if (item.markedForDeletion) continue;

                if (
                    player.x < item.x + item.width &&
                    player.x + player.width > item.x &&
                    player.y < item.y + item.height &&
                    player.y + player.height > item.y
                ) {
                    // 尋找物品欄空位
                    const emptySlot = inventory.findIndex(slot => slot === null);
                    if (emptySlot !== -1) {
                        inventory[emptySlot] = { type: item.type, healAmount: item.healAmount };
                        item.markedForDeletion = true;
                        soundFX.playItem();
                        updateInventoryUI();
                    }
                }
            }

            // 4. 掉落底部深淵判斷
            if (player.y > CANVAS_HEIGHT) {
                endGame('摔落到深淵了！');
            }
        }

        // 使用物品欄中的道具 (點擊滑鼠觸發)
        function useInventoryItem(index) {
            if (!isGameRunning || index < 0 || index >= 3) return;
            const item = inventory[index];
            if (!item) return;

            if (item.type === ITEM_TYPES.HEAL) {
                player.hp = Math.min(MAX_HP, player.hp + item.healAmount);
                soundFX.playHeal();
            } else if (item.type === ITEM_TYPES.UNTRAP) {
                player.trapTimer = 0; // 瞬間解除困住
                soundFX.playItem();
            } else if (item.type === ITEM_TYPES.SPEED) {
                player.speedBuffTimer = 300; // 加速 5 秒 (60fps * 5)
                soundFX.playItem();
            }

            // 使用完後清空該欄位
            inventory[index] = null;
            updateInventoryUI();
            updateUI();
        }

        // 更新 3 格物品欄 UI 顯示
        function updateInventoryUI() {
            for (let i = 0; i < 3; i++) {
                const slotEl = document.getElementById(`slot-${i}`);
                const item = inventory[i];

                if (!item) {
                    slotEl.innerHTML = '';
                    slotEl.style.borderColor = '#475569';
                    continue;
                }

                if (item.type === ITEM_TYPES.HEAL) {
                    slotEl.innerHTML = `<span class="text-green-400 font-bold text-xs">+${item.healAmount}</span>`;
                    slotEl.style.borderColor = '#22c55e';
                } else if (item.type === ITEM_TYPES.UNTRAP) {
                    slotEl.innerHTML = `<span class="text-purple-400 text-sm">✨</span>`;
                    slotEl.style.borderColor = '#a855f7';
                } else if (item.type === ITEM_TYPES.SPEED) {
                    slotEl.innerHTML = `<span class="text-yellow-400 text-sm">⚡</span>`;
                    slotEl.style.borderColor = '#eab308';
                }
            }
        }

        // UI 畫面更新
        function updateUI() {
            const hpPercent = Math.max(0, (player.hp / MAX_HP) * 100);
            hpBar.style.width = `${hpPercent}%`;
            hpText.textContent = `${Math.max(0, player.hp)}/${MAX_HP}`;

            // HP 低時變紅
            if (player.hp <= 3) {
                hpBar.className = "h-full bg-red-600 rounded-full transition-all duration-200 animate-pulse";
            } else {
                hpBar.className = "h-full bg-gradient-to-r from-red-600 via-yellow-500 to-green-500 rounded-full transition-all duration-200";
            }

            depthText.textContent = `B${score}`;
        }

        // 遊戲主迴圈
        function gameLoop() {
            if (!isGameRunning) return;

            // 清空畫布
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 背景細緻網格
            ctx.strokeStyle = 'rgba(30, 41, 59, 0.4)';
            ctx.lineWidth = 1;
            for (let y = 0; y < CANVAS_HEIGHT; y += 30) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(CANVAS_WIDTH, y);
                ctx.stroke();
            }

            // 1. 更新與繪製階梯
            for (let p of platforms) {
                p.update();
                p.draw(ctx);
            }

            // 清除走出畫面的階梯
            platforms = platforms.filter(p => !p.markedForDeletion);

            // 2. 生成新階梯
            generatePlatforms();

            // 3. 更新與繪製道具
            for (let item of items) {
                item.update();
                item.draw(ctx);
            }
            items = items.filter(i => !i.markedForDeletion);

            // 4. 更新與繪製玩家
            player.update();
            player.draw(ctx);

            // 5. 繪製頂部尖刺天花板
            drawCeilingSpikes(ctx);

            // 6. 碰撞偵測與計算分數
            handleCollisions();

            updateUI();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // 開始遊戲
        function startGame() {
            soundFX.init();
            isGameRunning = true;
            score = 0;
            lastPlatformY = CANVAS_HEIGHT - 60;
            lastPlatformX = CANVAS_WIDTH / 2 - 45;
            lastSpawnY = CANVAS_HEIGHT;

            inventory = [null, null, null];
            updateInventoryUI();

            platforms = [];
            items = [];

            // 初始安全平台
            const initPlatform = new Platform(CANVAS_WIDTH / 2 - 45, CANVAS_HEIGHT - 120, PLATFORM_TYPES.NORMAL);
            platforms.push(initPlatform);

            player.reset();
            updateUI();

            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        // 結束遊戲
        function endGame(reason) {
            isGameRunning = false;
            soundFX.playHurt();

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('ns_shaft_highscore', highScore.toString());
            }

            finalDepthText.textContent = `B${score}`;
            highScoreEndText.textContent = `B${highScore}`;
            gameOverReason.textContent = reason;

            gameOverScreen.classList.remove('hidden');
        }

        // 事件監聽 - 鍵盤按鍵
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                keys.left = true;
            }
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                keys.right = true;
            }
            // 鍵盤數字 1, 2, 3 快捷使用道具
            if (e.key === '1') {
                useInventoryItem(0);
            }
            if (e.key === '2') {
                useInventoryItem(1);
            }
            if (e.key === '3') {
                useInventoryItem(2);
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                keys.left = false;
            }
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                keys.right = false;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                keys.left = false;
            }
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                keys.right = false;
            }
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                keys.up = false;
            }
        });

        // 觸控控制（手機端）
        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
        btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
        btnRight.addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });

        // 按鈕點擊監聽
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // 初始化最高分顯示
        highScoreStartText.textContent = `B${highScore}`;
    </script>
</body>
</html>
