<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>世界生成器</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      background-color: #1a1a1a;
    }
    
    #instructions {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      cursor: pointer;
      z-index: 10;
    }

    #crosshair {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 14px; height: 14px;
      pointer-events: none;
      z-index: 5;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255, 255, 255, 0.9);
    }
    #crosshair::before { top: 6px; left: 0; width: 14px; height: 2px; }
    #crosshair::after  { top: 0; left: 6px; width: 2px; height: 14px; }

    #hotbar {
      position: absolute;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 10px;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px; border-radius: 10px;
      border: 2px solid #555;
      z-index: 5;
    }
    .slot {
      width: 50px; height: 50px; background: #333;
      border: 3px solid #777; border-radius: 6px;
      display: flex; justify-content: center; align-items: center;
      color: white; font-weight: bold; cursor: pointer; font-size: 12px;
      text-align: center;
    }
    .slot.active {
      border-color: #ffcc00; box-shadow: 0 0 10px #ffcc00; background: #444;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

<div id="crosshair"></div>

<div id="instructions">
  <h1 style="font-size: 36px; margin-bottom: 10px;">點擊畫面進入世界</h1>
  <p style="font-size: 18px; line-height: 1.8; text-align: center;">
    ⌨️ <b>W, A, S, D</b>：前後左右移動<br>
    🚀 <b>Space</b>：跳躍（無蜘蛛網減速，自然物理體感）<br>
    ⛏️ <b>左鍵</b>：破壞方塊（水無法破壞）<br>
    🧱 <b>右鍵</b>：放置方塊（瞄準水按右鍵可直接取代水）<br>
    🌊 <b>動態水流</b>：水會向下流動並向四周擴散<br>
    🔢 <b>1 ~ 5</b>：切換方塊種類<br>
    鍵盤 <b>ESC</b>：釋放滑鼠游標
  </p>
</div>

<div id="hotbar">
  <div class="slot active" data-type="grass">1<br>草地</div>
  <div class="slot" data-type="dirt">2<br>泥土</div>
  <div class="slot" data-type="stone">3<br>石頭</div>
  <div class="slot" data-type="wood">4<br>木頭</div>
  <div class="slot" data-type="brick">5<br>磚塊</div>
</div>

<script>
// ==========================================
// 1. 快速 Perlin Noise 演算法
// ==========================================
class PerlinNoise {
  constructor(seed = 12345) {
    this.p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) this.p[i] = i;
    let remaining = 256, s = seed;
    while (remaining > 1) {
      remaining--;
      s = (s * 9301 + 49297) % 233280;
      let i = Math.floor((s / 233280) * (remaining + 1));
      [this.p[remaining], this.p[i]] = [this.p[i], this.p[remaining]];
    }
    this.perm = new Uint8Array(512);
    for (let i = 0; i < 512; i++) this.perm[i] = this.p[i & 255];
  }
  fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  lerp(t, a, b) { return a + t * (b - a); }
  grad(hash, x, y) {
    const h = hash & 7, u = h < 4 ? x : y, v = h < 4 ? y : x;
    return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
  }
  noise(x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    x -= Math.floor(x); y -= Math.floor(y);
    const u = this.fade(x), v = this.fade(y);
    const A = this.perm[X] + Y, B = this.perm[X + 1] + Y;
    return this.lerp(v,
      this.lerp(u, this.grad(this.perm[A], x, y), this.grad(this.perm[B], x - 1, y)),
      this.lerp(u, this.grad(this.perm[A + 1], x, y - 1), this.grad(this.perm[B + 1], x - 1, y - 1))
    );
  }
}

// ==========================================
// 2. 材質生成
// ==========================================
function createPixelTexture(baseColorHex, noiseIntensity = 0.15) {
  const canvas = document.createElement('canvas');
  canvas.width = 16; canvas.height = 16;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = baseColorHex;
  ctx.fillRect(0, 0, 16, 16);
  for (let x = 0; x < 16; x++) {
    for (let y = 0; y < 16; y++) {
      const val = (Math.random() - 0.5) * noiseIntensity;
      ctx.fillStyle = val > 0 ? `rgba(255,255,255,${val})` : `rgba(0,0,0,${-val})`;
      ctx.fillRect(x, y, 1, 1);
    }
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.magFilter = THREE.NearestFilter;
  texture.minFilter = THREE.NearestFilter;
  return texture;
}

const materials = {
  grass: new THREE.MeshStandardMaterial({ map: createPixelTexture('#557a2b'), roughness: 0.8 }),
  dirt:  new THREE.MeshStandardMaterial({ map: createPixelTexture('#68492b'), roughness: 0.9 }),
  stone: new THREE.MeshStandardMaterial({ map: createPixelTexture('#737373'), roughness: 0.7 }),
  sand:  new THREE.MeshStandardMaterial({ map: createPixelTexture('#d6c585'), roughness: 0.9 }),
  wood:  new THREE.MeshStandardMaterial({ map: createPixelTexture('#855c33'), roughness: 0.6 }),
  brick: new THREE.MeshStandardMaterial({ map: createPixelTexture('#9e4733'), roughness: 0.7 }),
  water: new THREE.MeshStandardMaterial({ color: 0x0066cc, transparent: true, opacity: 0.65, roughness: 0.1 })
};

// ==========================================
// 3. 場景設定
// ==========================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new THREE.PointerLockControls(camera, document.body);
const instructions = document.getElementById('instructions');

instructions.addEventListener('click', () => controls.lock());
controls.addEventListener('lock', () => instructions.style.display = 'none');
controls.addEventListener('unlock', () => instructions.style.display = 'flex');

const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
dirLight.position.set(50, 100, 50);
dirLight.castShadow = true;
scene.add(dirLight);

// ==========================================
// 4. 高效能 250x250 虛擬世界地圖架構
// ==========================================
const MAP_SIZE = prompt("範圍:"); // 250 x 250 地形擴充
const HALF_MAP = Math.floor(MAP_SIZE / 2); // -125 ~ 125
const WATER_LEVEL = 4;
const RENDER_RADIUS = 35; // 玩家周圍渲染半徑

const perlin = new PerlinNoise(42);
const modifiedBlocks = new Map(); // 紀錄玩家修改過或水流動產生的方塊 "x,y,z" -> type ("air" 代表挖掘空處)
const activeMeshes = new Map();    // 畫面中實體的 Mesh "x,y,z" -> THREE.Mesh
const boxGeometry = new THREE.BoxGeometry(1, 1, 1);

// 地形高度計算 (高度函數)
function getTerrainHeight(x, z) {
  if (Math.abs(x) > HALF_MAP || Math.abs(z) > HALF_MAP) return -1;
  let n = perlin.noise(x * 0.03, z * 0.03) * 10 + perlin.noise(x * 0.08, z * 0.08) * 3;
  return Math.floor(n) + 6;
}

// 取得任意座標 (x, y, z) 的方塊種類
function getBlockType(x, y, z) {
  if (Math.abs(x) > HALF_MAP || Math.abs(z) > HALF_MAP || y < 0 || y > 30) return null;
  
  const key = `${x},${y},${z}`;
  if (modifiedBlocks.has(key)) {
    const type = modifiedBlocks.get(key);
    return type === 'air' ? null : type;
  }

  const h = getTerrainHeight(x, z);
  if (y <= h) {
    if (y === h) return h <= WATER_LEVEL + 1 ? 'sand' : 'grass';
    if (y < h - 2) return 'stone';
    return 'dirt';
  }
  if (y > h && y <= WATER_LEVEL) {
    return 'water';
  }
  return null;
}

// 設定方塊並更新畫面 Mesh
function setBlock(x, y, z, type) {
  const key = `${x},${y},${z}`;
  modifiedBlocks.set(key, type ? type : 'air');
  
  // 移除舊 Mesh
  if (activeMeshes.has(key)) {
    scene.remove(activeMeshes.get(key));
    activeMeshes.delete(key);
  }

  // 產生新 Mesh
  if (type && type !== 'air') {
    const mesh = new THREE.Mesh(boxGeometry, materials[type]);
    mesh.position.set(x, y, z);
    mesh.userData = { x, y, z, type };
    scene.add(mesh);
    activeMeshes.set(key, mesh);
  }
}

// 動態更新玩家周圍可見方塊
function updateVisibleChunks() {
  const px = Math.round(camera.position.x);
  const pz = Math.round(camera.position.z);

  // 1. 清理視線外的 Mesh
  activeMeshes.forEach((mesh, key) => {
    const { x, z } = mesh.userData;
    if (Math.abs(x - px) > RENDER_RADIUS || Math.abs(z - pz) > RENDER_RADIUS) {
      scene.remove(mesh);
      activeMeshes.delete(key);
    }
  });

  // 2. 載入視線內的 Mesh
  for (let x = px - RENDER_RADIUS; x <= px + RENDER_RADIUS; x++) {
    for (let z = pz - RENDER_RADIUS; z <= pz + RENDER_RADIUS; z++) {
      if (Math.abs(x) > HALF_MAP || Math.abs(z) > HALF_MAP) continue;
      
      const h = getTerrainHeight(x, z);
      const maxY = Math.max(h, WATER_LEVEL) + 5;

      for (let y = 0; y <= maxY; y++) {
        const key = `${x},${y},${z}`;
        if (!activeMeshes.has(key)) {
          const type = getBlockType(x, y, z);
          if (type) {
            // 簡化遮擋剔除：只有當方塊相鄰六面至少有一面不是實體時才繪製
            const isExposed = !getBlockType(x+1, y, z) || !getBlockType(x-1, y, z) ||
                              !getBlockType(x, y+1, z) || !getBlockType(x, y-1, z) ||
                              !getBlockType(x, y, z+1) || !getBlockType(x, y, z-1);
            if (isExposed) {
              const mesh = new THREE.Mesh(boxGeometry, materials[type]);
              mesh.position.set(x, y, z);
              mesh.userData = { x, y, z, type };
              scene.add(mesh);
              activeMeshes.set(key, mesh);
            }
          }
        }
      }
    }
  }
}
// 判斷相鄰方塊是否會透光/可見
function isSideVisible(myType, neighborType) {
  if (!neighborType) return true; // 相鄰是空氣，必須繪製
  if (myType !== 'water' && neighborType === 'water') return true; // 實體方塊碰到水，必須繪製
  if (myType === 'water' && neighborType !== 'water') return true; // 水碰到實體方塊，必須繪製
  return false; // 同種類或實體擋實體，隱藏內部網格
}

// 動態更新玩家周圍可見方塊
function updateVisibleChunks() {
  const px = Math.round(camera.position.x);
  const pz = Math.round(camera.position.z);

  // 1. 清理視線外的 Mesh
  activeMeshes.forEach((mesh, key) => {
    const { x, z } = mesh.userData;
    if (Math.abs(x - px) > RENDER_RADIUS || Math.abs(z - pz) > RENDER_RADIUS) {
      scene.remove(mesh);
      activeMeshes.delete(key);
    }
  });

  // 2. 載入視線內的 Mesh
  for (let x = px - RENDER_RADIUS; x <= px + RENDER_RADIUS; x++) {
    for (let z = pz - RENDER_RADIUS; z <= pz + RENDER_RADIUS; z++) {
      if (Math.abs(x) > HALF_MAP || Math.abs(z) > HALF_MAP) continue;
      
      const h = getTerrainHeight(x, z);
      const maxY = Math.max(h, WATER_LEVEL) + 5;

      for (let y = 0; y <= maxY; y++) {
        const key = `${x},${y},${z}`;
        if (!activeMeshes.has(key)) {
          const type = getBlockType(x, y, z);
          if (type) {
            // 修正：檢查六個面，只要有一面鄰近空氣或透光介質（水）就繪製 Mesh
            const isExposed = 
              isSideVisible(type, getBlockType(x + 1, y, z)) ||
              isSideVisible(type, getBlockType(x - 1, y, z)) ||
              isSideVisible(type, getBlockType(x, y + 1, z)) ||
              isSideVisible(type, getBlockType(x, y - 1, z)) ||
              isSideVisible(type, getBlockType(x, y, z + 1)) ||
              isSideVisible(type, getBlockType(x, y, z - 1));

            if (isExposed) {
              const mesh = new THREE.Mesh(boxGeometry, materials[type]);
              mesh.position.set(x, y, z);
              mesh.userData = { x, y, z, type };
              scene.add(mesh);
              activeMeshes.set(key, mesh);
            }
          }
        }
      }
    }
  }
}
// 初始化玩家起始高度
const startH = getTerrainHeight(0, 0);
camera.position.set(0, Math.max(startH + 3, WATER_LEVEL + 3), 0);

// ==========================================
// 5. 動態水流模擬系統 (水流擴散機制)
// ==========================================
let lastWaterTick = 0;
function updateWaterSimulation(now) {
  if (now - lastWaterTick < 180) return; // 每 180ms 擴散一次
  lastWaterTick = now;

  const px = Math.round(camera.position.x);
  const pz = Math.round(camera.position.z);
  const waterSpreads = [];

  // 只在玩家附近的 25x25 區域演算水流
  for (let x = px - 25; x <= px + 25; x++) {
    for (let z = pz - 25; z <= pz + 25; z++) {
      if (Math.abs(x) > HALF_MAP || Math.abs(z) > HALF_MAP) continue;

      for (let y = 1; y <= 15; y++) {
        if (getBlockType(x, y, z) === 'water') {
          // 1. 優先向下流動
          if (getBlockType(x, y - 1, z) === null) {
            waterSpreads.push({ x, y: y - 1, z });
          } else {
            // 2. 下方被擋住，向四周水平擴散
            const neighbors = [
              { x: x + 1, y, z }, { x: x - 1, y, z },
              { x, y, z: z + 1 }, { x, y, z: z - 1 }
            ];
            for (const n of neighbors) {
              if (Math.abs(n.x) <= HALF_MAP && Math.abs(n.z) <= HALF_MAP) {
                if (getBlockType(n.x, n.y, n.z) === null) {
                  waterSpreads.push(n);
                }
              }
            }
          }
        }
      }
    }
  }

  // 執行水流擴散放置
  for (const w of waterSpreads) {
    setBlock(w.x, w.y, w.z, 'water');
  }
}

// ==========================================
// 6. 玩家控制與 3D AABB 碰撞阻擋 (無蜘蛛網)
// ==========================================
let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
let canJump = false;
const velocity = new THREE.Vector3();

const PLAYER_RADIUS = 0.3;  // 玩家半徑
const PLAYER_HEIGHT = 1.7;  // 玩家總身高
const EYE_HEIGHT = 1.5;     // 眼睛到腳底的距離

window.addEventListener('keydown', (e) => {
  switch (e.code) {
    case 'KeyW': moveForward = true; break;
    case 'KeyS': moveBackward = true; break;
    case 'KeyA': moveLeft = true; break;
    case 'KeyD': moveRight = true; break;
    case 'Space':
      if (canJump) { velocity.y = 8.5; canJump = false; }
      break;
  }
  if (['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5'].includes(e.code)) {
    const idx = parseInt(e.key) - 1;
    const slots = document.querySelectorAll('.slot');
    slots.forEach(s => s.classList.remove('active'));
    slots[idx].classList.add('active');
    selectedType = slots[idx].dataset.type;
  }
});

window.addEventListener('keyup', (e) => {
  switch (e.code) {
    case 'KeyW': moveForward = false; break;
    case 'KeyS': moveBackward = false; break;
    case 'KeyA': moveLeft = false; break;
    case 'KeyD': moveRight = false; break;
  }
});

// 精確 AABB 方塊碰撞阻擋 (方塊世界座標 x, y, z 之範圍為 [x-0.5, x+0.5])
function checkCollision(pos) {
  const pMinX = pos.x - PLAYER_RADIUS;
  const pMaxX = pos.x + PLAYER_RADIUS;
  const pMinY = pos.y - EYE_HEIGHT;
  const pMaxY = pos.y - EYE_HEIGHT + PLAYER_HEIGHT;
  const pMinZ = pos.z - PLAYER_RADIUS;
  const pMaxZ = pos.z + PLAYER_RADIUS;

  // 正確對齊方塊網格邊界 (方塊中心為整數，半寬為 0.5)
  const minX = Math.floor(pMinX + 0.5);
  const maxX = Math.floor(pMaxX + 0.5);
  const minY = Math.floor(pMinY + 0.5);
  const maxY = Math.floor(pMaxY + 0.5);
  const minZ = Math.floor(pMinZ + 0.5);
  const maxZ = Math.floor(pMaxZ + 0.5);

  for (let x = minX; x <= maxX; x++) {
    for (let y = minY; y <= maxY; y++) {
      for (let z = minZ; z <= maxZ; z++) {
        const type = getBlockType(x, y, z);
        if (type && type !== 'water') { // 水無視碰撞
          // 重疊條件判定
          if (pMaxX > x - 0.5 && pMinX < x + 0.5 &&
              pMaxY > y - 0.5 && pMinY < y + 0.5 &&
              pMaxZ > z - 0.5 && pMinZ < z + 0.5) {
            return true;
          }
        }
      }
    }
  }
  return false;
}
// ==========================================
// 7. 互動機制 (水不可破壞 / 水中放置方塊)
// ==========================================
const raycaster = new THREE.Raycaster();
let selectedType = 'grass';

document.querySelectorAll('.slot').forEach(slot => {
  slot.addEventListener('click', () => {
    document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
    slot.classList.add('active');
    selectedType = slot.dataset.type;
  });
});

window.addEventListener('pointerdown', (e) => {
  if (!controls.isLocked) return;

  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const intersects = raycaster.intersectObjects(Array.from(activeMeshes.values()));

  if (intersects.length > 0) {
    const hit = intersects[0];
    if (hit.distance > 6) return;

    const { x, y, z, type } = hit.object.userData;

    if (e.button === 0) { 
      // 功能：水不可破壞
      if (type === 'water') return;
      setBlock(x, y, z, null);
    } 
    else if (e.button === 2) { 
      // 功能：水中放置方塊 (若瞄準水，直接替換該水方塊)
      if (type === 'water') {
        setBlock(x, y, z, selectedType);
      } else {
        const normal = hit.face.normal;
        const tx = x + normal.x;
        const ty = y + normal.y;
        const tz = z + normal.z;

        // 防止把方塊放置在玩家身體裡
        const pFeetY = camera.position.y - EYE_HEIGHT;
        if (Math.abs(tx - camera.position.x) < PLAYER_RADIUS + 0.5 &&
            Math.abs(tz - camera.position.z) < PLAYER_RADIUS + 0.5 &&
            ty + 0.5 > pFeetY && ty - 0.5 < pFeetY + PLAYER_HEIGHT) {
          return;
        }
        setBlock(tx, ty, tz, selectedType);
      }
    }
  }
});

window.addEventListener('contextmenu', e => e.preventDefault());

// ==========================================
// 8. 主遊戲物理與渲染迴圈
// ==========================================
let prevTime = performance.now();

function animate(now) {
  requestAnimationFrame(animate);

  updateWaterSimulation(now);

  if (controls.isLocked) {
    const delta = Math.min((now - prevTime) / 1000, 0.1);

    updateVisibleChunks();

    // 1. 阻尼與重力
    velocity.x -= velocity.x * 10.0 * delta;
    velocity.z -= velocity.z * 10.0 * delta;
    velocity.y -= 25.0 * delta;

    // 2. 計算視角前進與側移的世界座標平面向量 (忽略 Y 軸俯仰角)
    const frontVector = new THREE.Vector3();
    const sideVector = new THREE.Vector3();
    
    camera.getWorldDirection(frontVector);
    frontVector.y = 0;
    frontVector.normalize();

    sideVector.crossVectors(camera.up, frontVector).normalize(); // 右方向量

    const inputZ = Number(moveForward) - Number(moveBackward);
    const inputX = Number(moveRight) - Number(moveLeft);

    const moveDir = new THREE.Vector3();
    if (inputZ !== 0) moveDir.addScaledVector(frontVector, inputZ);
    if (inputX !== 0) moveDir.addScaledVector(sideVector, -inputX);
    if (moveDir.lengthSq() > 0) moveDir.normalize();

    if (moveForward || moveBackward || moveLeft || moveRight) {
      velocity.x += moveDir.x * 45.0 * delta;
      velocity.z += moveDir.z * 45.0 * delta;
    }

    // 3. 嚴格的世界座標獨立分軸碰撞解算 (防止斜向穿牆與視角拉扯)

    // X 軸移動與碰撞判定
    camera.position.x += velocity.x * delta;
    if (checkCollision(camera.position)) {
      camera.position.x -= velocity.x * delta;
      velocity.x = 0;
    }

    // Z 軸移動與碰撞判定
    camera.position.z += velocity.z * delta;
    if (checkCollision(camera.position)) {
      camera.position.z -= velocity.z * delta;
      velocity.z = 0;
    }

    // Y 軸移動與碰撞判定 (重力與跳躍)
    camera.position.y += velocity.y * delta;
    if (checkCollision(camera.position)) {
      camera.position.y -= velocity.y * delta;
      if (velocity.y < 0) {
        canJump = true; // 著地
      }
      velocity.y = 0;
    }
  }

  prevTime = now;
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate(performance.now());
</script>

</body>
</html>
