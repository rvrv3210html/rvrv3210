            right: 20px;

        #downloadSh button:hover {
            color: #000;         
        }
        button:active {
            background-color: #bcda14;
            transform: scale(0.95);        
        }

        .keypad button {
            width: 100%;
            aspect-ratio: 1 / 1;
            font-size: clamp(16px, 4vw, 22px);
            cursor: pointer;
            background-color: #34495e;
            color: #fff;
            border: 1px solid #4e6d8c;

            padding: 0;

        .keypad button:hover {

        }

        .keypad button:active {

            transform: scale(0.95);
        }

        #Marquee {
            width: 100%;

            font-size: 30px;
            box-shadow: inset 0 0 10px #0009;
            position: relative;
        }
        #Marquee h3 {
            display: inline-block;

            animation: marqueeScroll 20s linear infinite;  
        }
        @keyframes marqueeScroll {
            0% { transform: translateX(100%); }

        }
    </style>

    <!-- JavaScript 邏輯 -->
    <script>
        const inputField = document.getElementById('display');
        const noteArea = document.getElementById('tnotes');
        const themeInput = document.getElementById('theme');
        const timerDisplay = document.getElementById('timerDisplay');
        const type = document.getElementById('type');
        const s = document.getElementById('s');
        const m = document.getElementById('m');
        const h = document.getElementById('h');
        const urlInput = document.getElementById('URL');
        // 修正 ID 拼寫錯誤 (textcolor)
        const bodyColorInput = document.getElementById('bodycoior');
        const textColorInput = document.getElementById('textcolor');
        const Beforetime = document.getElementById('Beforetime');
        let timerInterval = null;
        let totalSeconds = 0;

        function showNotes() {
            document.getElementById('pageTitle').innerHTML = '筆記';
            document.getElementById('notes').style.display = 'block';
            document.getElementById('Computer').style.display = 'none';
            document.getElementById('Timer').style.display = 'none';

        function showIndex() {

            document.getElementById('notes').style.display = 'none';

            document.getElementById('new').style.display = 'block';

        function showComputer() {
            document.getElementById('pageTitle').innerHTML = '計算機';
            document.getElementById('notes').style.display = 'none';
            document.getElementById('Computer').style.display = 'block';  
            document.getElementById('Timer').style.display = 'none';
            document.getElementById('settings').style.display = 'none';
            document.getElementById('qrcode').style.display = 'none'; 
            document.getElementById('new').style.display = 'none';          
        }

        function showTimer() {
            document.getElementById('pageTitle').innerHTML = '計時器';
            document.getElementById('notes').style.display = 'none';
            document.getElementById('Computer').style.display = 'none';
            document.getElementById('Timer').style.display = 'block';
            document.getElementById('settings').style.display = 'none';
            document.getElementById('qrcode').style.display = 'none'; 
            document.getElementById('new').style.display = 'none';
        }

        function settings(){
            document.getElementById('pageTitle').innerHTML = '設定';
            document.getElementById('new').style.display = 'none';
            document.getElementById('notes').style.display = 'none';
            document.getElementById('Computer').style.display = 'none';
            document.getElementById('settings').style.display = 'block';
            document.getElementById('Timer').style.display = 'none';
            document.getElementById('qrcode').style.display = 'none';

        function qrcode(){

            document.getElementById('new').style.display = 'none';

        function shownew(){
            document.getElementById('pageTitle').innerHTML = '其他小工具';
            document.getElementById('new').style.display = 'block';
            document.getElementById('notes').style.display = 'none';

            document.getElementById('qrcode').style.display = 'none';

        // 下載無網網頁檔
        function downloadSh() {
            const cloneDoc = document.documentElement.cloneNode(true);
            const unwantedDiv = cloneDoc.querySelector('#downloadSh');
            if (unwantedDiv) {
                unwantedDiv.remove();
            }
            const htmlContent = "<!DOCTYPE html>\n" + cloneDoc.outerHTML;
    
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'rvrv3210小工具.html';
            link.click();
            URL.revokeObjectURL(link.href);
        }

        // 儲存為 JSON 格式
        function downloadnt() {
            const noteContent = noteArea.value;
            const themeContent = themeInput.value;
            
            if (!noteContent.trim() && !themeContent.trim()) {
                alert("筆記主題與內容皆無文字喔！");
                return;
            }
    
            const noteData = {
                appName: "rvrv3210小工具",
                version: "v3",
                theme: themeContent,
                content: noteContent,
                saveTime: new Date().toLocaleString()
            };

            const jsonString = JSON.stringify(noteData, null, 2);
            const blob = new Blob([jsonString], { type: 'application/json;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            
            const fileName = themeContent.trim() ? `rvrv3210小工具-筆記-${themeContent}.json` : 'rvrv3210小工具-筆記.json';
            link.download = fileName;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        // 讀取/匯入 JSON 筆記
        function importnt(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    themeInput.value = data.theme || '';
                    noteArea.value = data.content || '';
                    Beforetime.innerHTML =  "上次存檔於:" + data.saveTime || '';
                    alert("筆記讀取成功！");
                } catch (error) {
                    alert("讀取失敗：檔案格式不正確或不是有效的 JSON 檔！");
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        // 計算機相關邏輯
        function insertAtCursor(text) {
            const start = inputField.selectionStart ?? inputField.value.length;
            const end = inputField.selectionEnd ?? inputField.value.length;
            const val = inputField.value;

            inputField.value = val.slice(0, start) + text + val.slice(end);
            const newPos = start + text.length;
            inputField.setSelectionRange(newPos, newPos);
            inputField.focus();
        }

        function press(value) {
            insertAtCursor(value);
        }

        function backspace() {
            const start = inputField.selectionStart;
            const end = inputField.selectionEnd;
            if (start === null) return;

            const val = inputField.value;
            if (start !== end) {
                inputField.value = val.slice(0, start) + val.slice(end);
                inputField.setSelectionRange(start, start);
            } else if (start > 0) {
                inputField.value = val.slice(0, start - 1) + val.slice(start);
                inputField.setSelectionRange(start - 1, start - 1);
            }
            inputField.focus();
        }

        function clearAll() {
            inputField.value = '';
            inputField.focus();
        }

        function pressCustomRoot() {
            insertAtCursor('√(');
        }

        function toggleSignAtCursor() {
            let val = inputField.value;
            let pos = inputField.selectionStart ?? val.length;

            const leftPart = val.slice(0, pos);
            const rightPart = val.slice(pos);

            const parenNegMatch = leftPart.match(/\(-(\d+\.?\d*)$/);
            if (parenNegMatch && rightPart.startsWith(')')) {
                const num = parenNegMatch[1];
                const newLeft = leftPart.slice(0, leftPart.length - parenNegMatch[0].length) + num;
                const newRight = rightPart.slice(1);
                inputField.value = newLeft + newRight;
                const newPos = newLeft.length;
                inputField.setSelectionRange(newPos, newPos);
                inputField.focus();
                return;
            }

            const numMatch = leftPart.match(/(\d+\.?\d*)$/);
            if (numMatch) {
                const num = numMatch[1];
                const newLeft = leftPart.slice(0, leftPart.length - num.length) + `(-${num})`;
                inputField.value = newLeft + rightPart;
                const newPos = newLeft.length - 1; 
                inputField.setSelectionRange(newPos, newPos);
                inputField.focus();
                return;
            }

            insertAtCursor('(-');
        }

        function parseExpression(expr) {
            let parsed = expr.replace(/(\d+)?√\(([^)]+)\)/g, (match, root, num) => {
                const r = root ? root : '2';
                return `((${num})**(1/${r}))`;
            });
            return parsed;
        }

        function ster() {
            if (!inputField.value) return;
            try {
                const parsedExpr = parseExpression(inputField.value);
                const result = new Function(`return ${parsedExpr}`)();
                if (result === undefined || !isFinite(result)) {
                    inputField.value = 'Error';
                } else {
                    inputField.value = result;
                }
            } catch (error) {
                inputField.value = 'Error';
            }
        }

        function percent() {
            if (!inputField.value) return;
            try {
                const parsedExpr = parseExpression(inputField.value);
                const result = new Function(`return ${parsedExpr}`)();
                if (isFinite(result)) {
                    inputField.value = result / 100;
                } else {
                    inputField.value = 'Error';
                }
            } catch {
                inputField.value = 'Error';
            }
        }

        function teaching() {
            alert("進入教學模式囉");
            alert("因為是js寫的，因此會稍不同。");
            alert("按了xʸ，會出現**(這是正常現象，ʸ打在**後。)");
            alert("要再數字後按了±(有效)，+變-,-變+。)");
            alert("e的用法:科學記號");
        }

        // 計時器相關邏輯
        function startTimer() {
            if (timerInterval) return;

            if (type.selectedIndex === 1 && totalSeconds === 0) {
                const hours = parseInt(h.value) || 0;
                const minutes = parseInt(m.value) || 0;
                const seconds = parseInt(s.value) || 0;

                totalSeconds = (hours * 3600) + (minutes * 60) + seconds;

                if (totalSeconds <= 0) {
                    alert("請設定大於 0 的倒數時間！");
                    return;
                }
            }

            timerInterval = setInterval(() => {
                if (type.selectedIndex === 0) {
                    totalSeconds++;
                } else {
                    if (totalSeconds > 0) {
                        totalSeconds--;
                    } else {
                        pauseTimer();
                        const alarmSound = new Audio("rvrv3210.mp3");
                        timerDisplay.textContent = "時間到！";
                        alarmSound.play().catch(err => {
                            console.log("音效播放被瀏覽器阻擋或找不到檔案：", err);
                        });
                        return;
                    }
                }
                timerDisplay.textContent = formatTime(totalSeconds);
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function resetTimer() {
            pauseTimer();
            totalSeconds = 0;
            timerDisplay.textContent = formatTime(totalSeconds);
        }

        function formatTime(seconds) {
            const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
            const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
            const secs = String(seconds % 60).padStart(2, '0');
            return `${hrs}:${mins}:${secs}`;
        }

        // 即時時鐘
        function time() {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            document.getElementById("time").textContent = timeString;
        }

        // 設定：即時更改背景顏色
        bodyColorInput.addEventListener('input', function() {
            document.body.style.backgroundColor = bodyColorInput.value;
        });

        // 設定：即時更改文字顏色 (修正 style.Color 為 style.color)
        textColorInput.addEventListener('input', function() {
            document.body.style.color = textColorInput.value;
        });

        // 「回復」按鈕功能：恢復預設背景色與文字顏色
        function resetBackgroundColor() {
            const defaultBg = '#1abed4';
            const defaultText = '#000000';

            bodyColorInput.value = defaultBg;
            document.body.style.backgroundColor = defaultBg;

            textColorInput.value = defaultText;
            document.body.style.color = defaultText;
        }

        //QR Code
        function generateQRCode() {
            // 使用 urlInput.value 取得輸入的網址
            const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=` + encodeURIComponent(urlInput.value);
            document.getElementById('qrcodeImg').src = qrApiUrl;
        }

        // 讀取/掃描上傳的 QR Code 圖片
        function scanQRCode(event) {
            const file = event.target.files[0];
            if (!file) return;

            // 建立實例
            const html5QrCode = new Html5Qrcode("reader"); 
    
            // 使用建立好的 html5QrCode 物件來呼叫 scanFile
            html5QrCode.scanFile(file, true)
            .then(decodedText => {
                document.getElementById('qrResult').innerHTML = 
                    `掃描成功！內容：<br><a href="${decodedText}" target="_blank" style="color: #fff;">${decodedText}</a>`;
                alert("QR Code 讀取成功！");
        
                // 掃描完成後可以清除實例
                html5QrCode.clear();
            })
            .catch(err => {
                alert("讀取失敗：無法辨識此圖片中的 QR Code！");
                console.log(`Error scanning file. Reason: ${err}`);
                html5QrCode.clear();
            });

            event.target.value = '';
        }
        setInterval(time, 1000);
        showIndex();
    </script>
</body>
</html>
