        /* 預設隱藏筆記區塊 */

        /* textarea 樣式語法和給予適當大小 */
        textarea {

        /* 計算機主體容器 */

        /* 顯示框：跨滿所有網格欄位 */
        input#display {
            grid-column: 1 / -1;
            width: 100%;
            height: 65px;
            font-size: clamp(20px, 5vw, 32px);
            text-align: right;
            padding: 5px 15px;
            box-sizing: border-box;

            border-radius: 8px;
            margin-bottom: 12px;
            outline: none;
        }

        /* 鍵盤網格 */
        .keypad {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        #downloadSh button { 
            font-size: 25px;
            color: #644545;
            background: linear-gradient(to right,#ff0000,#ff8800,#ffff00,#00ff00,#00ffff,#0000ff,#aa00aa);

            transition: 1s;
            text-align: center;
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
        }
        #downloadSh button:hover {
            color: #000;         
        }
        button:active {
            background-color: #bcda14;
            transform: scale(0.95);        
        }

        .keypad button {
            width: 100%;
            aspect-ratio: 1 / 1;
            font-size: clamp(16px, 4vw, 22px);
            cursor: pointer;
            background-color: #34495e;
            color: #fff;
            border: 1px solid #4e6d8c;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: background-color 0.1s, transform 0.1s;
        }

        .keypad button:hover {
            background-color: #4e6d8c;
        }

        .keypad button:active {
            background-color: #1abc9c;
            transform: scale(0.95);
        }
        /* 跑馬燈 */
    /* 跑馬燈外框 */
    #Marquee {
        width: 100%;         
       overflow: hidden;
        border: 1px solid #000;
        white-space: nowrap;
        font-size: 30px;
        box-shadow: inset 0 0 10px #0009;
        position: relative;
    }

    /* 跑馬燈文字本體 */
    #Marquee h3 {
        display: inline-block;
        margin: 5px 0;
        /* 從畫面最右側 (100%) 開始，向左滾動到完全消失 (-100%) */
        animation: marqueeScroll 20s linear infinite; 
    }

    /* 使用 transform 確保等速滑動 */
    @keyframes marqueeScroll {
        0% {
            transform: translateX(100%);
        }
        100% {
            transform: translateX(-100%);
        }
    }
    </style>
</head>

    <!-- 計時器區塊 -->

        <button onclick="startTimer()" style="background-color: #27ae60; color: white; padding: 10px 20px; font-size: 18px; border-radius: 8px; border: none; cursor: pointer;">開始</button>
        <button onclick="pauseTimer()" style="background-color: #f39c12; color: white; padding: 10px 20px; font-size: 18px; border-radius: 8px; border: none; cursor: pointer;">暫停</button>

        <button onclick="showComputer()" id="bComputer">計算機</button>
        <button onclick="showTimer()" id="bTimer">計時器</button>
        <br><br>
        <a href="https://rvrv3210html.github.io/rvrv3210/tool/rvrv3210小工具.exe" download="rvrv3210小工具.exe">
            <button style="font-size: 20px; padding: 10px 20px; background-color: #27ae60; color: white; border-radius: 8px; border: none; cursor: pointer;">
                下載 Desktop .exe 桌面版(此版本為測試版)

    <div id="downloadSh">
        <button onclick="downloadSh()">下載無網網頁檔</button>

    <!-- JavaScript 邏輯 -->
    <script>
        const inputField = document.getElementById('display');
        const noteArea = document.getElementById('tnotes');
        const timerDisplay = document.getElementById('timerDisplay');
        let timerInterval = null;
        let totalSeconds = 0;

        function showNotes() {
            // 僅改變 #pageTitle 的內容，時鐘 #time 會安全保留
            document.getElementById('pageTitle').innerHTML = '筆記';
            document.getElementById('notes').style.display = 'block';
            document.getElementById('Computer').style.display = 'none';
            document.getElementById('Timer').style.display = 'none';
            document.getElementById('new').style.display = 'none';
        }

        function showIndex() {
            document.getElementById('pageTitle').innerHTML = '首頁<t style="color: yellow;">(v3)</t>';
            document.getElementById('notes').style.display = 'none';
            document.getElementById('Computer').style.display = 'none';
            document.getElementById('Timer').style.display = 'none';
            document.getElementById('new').style.display = 'block';
        }

        function showComputer() {
            document.getElementById('pageTitle').innerHTML = '計算機';
            document.getElementById('notes').style.display = 'none';
            document.getElementById('Computer').style.display = 'block';  
            document.getElementById('Timer').style.display = 'none';
            document.getElementById('new').style.display = 'none';          
        }

        function showTimer() {
            document.getElementById('pageTitle').innerHTML = '計時器';
            document.getElementById('notes').style.display = 'none';
            document.getElementById('Computer').style.display = 'none';
            document.getElementById('Timer').style.display = 'block';
            document.getElementById('new').style.display = 'none';
        }
        function shownew(){
            document.getElementById('pageTitle').innerHTML = '其他小工具';
            document.getElementById('new').style.display = 'block';
            document.getElementById('notes').style.display = 'none';
            document.getElementById('Computer').style.display = 'none';
            document.getElementById('Timer').style.display = 'none';
        }
        function downloadSh() {
            const cloneDoc = document.documentElement.cloneNode(true);
            const unwantedDiv = cloneDoc.querySelector('#downloadSh');
            if (unwantedDiv) {
                unwantedDiv.remove();
            }
            const htmlContent = "<!DOCTYPE html>\n" + cloneDoc.outerHTML;
    
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'rvrv3210小工具.html';
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function downloadnt() {
            const note = noteArea.value;
            if (!note.trim()) {
                alert("筆記無文字喔！");
                return;
            }
    
            const blob = new Blob([note], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'rvrv3210小工具-筆記.txt';
            link.click();
            URL.revokeObjectURL(link.href);
        }

        // 計算機相關邏輯
        function insertAtCursor(text) {
            const start = inputField.selectionStart ?? inputField.value.length;
            const end = inputField.selectionEnd ?? inputField.value.length;
            const val = inputField.value;

            inputField.value = val.slice(0, start) + text + val.slice(end);
            const newPos = start + text.length;
            inputField.setSelectionRange(newPos, newPos);
            inputField.focus();
        }

        function press(value) {
            insertAtCursor(value);
        }

        function backspace() {
            const start = inputField.selectionStart;
            const end = inputField.selectionEnd;
            if (start === null) return;

            const val = inputField.value;
            if (start !== end) {
                inputField.value = val.slice(0, start) + val.slice(end);
                inputField.setSelectionRange(start, start);
            } else if (start > 0) {
                inputField.value = val.slice(0, start - 1) + val.slice(start);
                inputField.setSelectionRange(start - 1, start - 1);
            }
            inputField.focus();
        }

        function clearAll() {
            inputField.value = '';
            inputField.focus();
        }

        function pressCustomRoot() {
            insertAtCursor('√(');
        }

        function toggleSignAtCursor() {
            let val = inputField.value;
            let pos = inputField.selectionStart ?? val.length;

            const leftPart = val.slice(0, pos);
            const rightPart = val.slice(pos);

            const parenNegMatch = leftPart.match(/\(-(\d+\.?\d*)$/);
            if (parenNegMatch && rightPart.startsWith(')')) {
                const num = parenNegMatch[1];
                const newLeft = leftPart.slice(0, leftPart.length - parenNegMatch[0].length) + num;
                const newRight = rightPart.slice(1);
                inputField.value = newLeft + newRight;
                const newPos = newLeft.length;
                inputField.setSelectionRange(newPos, newPos);
                inputField.focus();
                return;
            }

            const numMatch = leftPart.match(/(\d+\.?\d*)$/);
            if (numMatch) {
                const num = numMatch[1];
                const newLeft = leftPart.slice(0, leftPart.length - num.length) + `(-${num})`;
                inputField.value = newLeft + rightPart;
                const newPos = newLeft.length - 1; 
                inputField.setSelectionRange(newPos, newPos);
                inputField.focus();
                return;
            }

            insertAtCursor('(-');
        }

        function parseExpression(expr) {
            let parsed = expr.replace(/(\d+)?√\(([^)]+)\)/g, (match, root, num) => {
                const r = root ? root : '2';
                return `((${num})**(1/${r}))`;
            });
            return parsed;
        }

        function ster() {
            if (!inputField.value) return;
            try {
                const parsedExpr = parseExpression(inputField.value);
                const result = new Function(`return ${parsedExpr}`)();
                if (result === undefined || !isFinite(result)) {
                    inputField.value = 'Error';
                } else {
                    inputField.value = result;
                }
            } catch (error) {
                inputField.value = 'Error';
            }
        }

        function percent() {
            if (!inputField.value) return;
            try {
                const parsedExpr = parseExpression(inputField.value);
                const result = new Function(`return ${parsedExpr}`)();
                if (isFinite(result)) {
                    inputField.value = result / 100;
                } else {
                    inputField.value = 'Error';
                }
            } catch {
                inputField.value = 'Error';
            }
        }

        function teaching() {
            alert("進入教學模式囉");
            alert("因為是js寫的，因此會稍不同。");
            alert("按了xʸ，會出現**(這是正常現象，ʸ打在**後。)");
            alert("要再數字後按了±(有效)，+變-,-變+。)");
            alert("e的用法:科學記號");
        }

        // 計時器相關邏輯
        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                totalSeconds++;
                timerDisplay.textContent = formatTime(totalSeconds);
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function resetTimer() {
            pauseTimer();
            totalSeconds = 0;
            timerDisplay.textContent = formatTime(totalSeconds);
        }

        function formatTime(seconds) {
            const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
            const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
            const secs = String(seconds % 60).padStart(2, '0');
            return `${hrs}:${mins}:${secs}`;
        }

        // 即時時鐘
        function time() {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            document.getElementById("time").textContent = timeString;
        }

        setInterval(time, 1000);
        showIndex();
    </script>
