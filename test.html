<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rvrv3210網站-計算機</title>
    <link rel="icon" sizes="400x500" href="game/loge.jpg">
    <style>
        body{
            background-color: #00b0cb;  
        }
        header{
            text-align:center;
            color:#ffffff;
            background:linear-gradient(to right,
            #ff0000,
            #ff8800,
            #ffff00,
            #00ff00,
            #00ffff,
            #0000ff,
            #aa00aa,
            #0000ff,
            #00ffff,
            #00ff00,
            #ffff00,
            #ff8800,
            #ff0000);
            background-size: 400%;
            white-space: nowrap; 
            overflow: hidden; 
            animation: rainbow 15s linear infinite;            
        }
        main{
            text-align:center;
            background-color: #000;
            color: #fff;
            animation: Black_to_White_to_Black 10s infinite; 
            box-shadow: 10px 10px 10px 0px #777;
        }
        footer{
            background: linear-gradient(to right,#ffffff,#000000);
            text-align:center;
            background-size: 200%;
            animation: Black_and_white 2s infinite; 
                      
        }
        footer button{
            font-size: 25px;
            color: #fff;
            background: linear-gradient(to right,#ff0000,#ff8800,#ffff00,#00ff00,#00ffff,#0000ff,#aa00aa);
            border-radius: 20px;   
            transition: 1s;
            text-align:center;
        }
        footer button:hover{
            color: #000;           
        }
        nav button{
            border-radius: 20px;
            background: linear-gradient(to right,#000000,#ffffff);
            color: #eeff00;
            background-size: 200%;
            transition: 1s;
        }
        nav button:hover{
            font-size: 25px;
            background-position:100%;
            color: #ff0000;
        }
        main button{
            color: #fff;
            background-color: #000;
            border-radius: 20px;
        }
        nav{
            background-color: linear-gradient(to right,#ffffff,#000000);
            animation: Black_to_White_to_Black 2s infinite; 
        }
        main div{
            color: #000;
            background: linear-gradient(to right bottom,#ff0000,#ff8800);
            border: 10px #000 groove;
        }
        b{
            font-size: 35px;
        }
        b img{
            transform: translate(0,4px);
        }
        @keyframes Black_to_White_to_Black{
            0%{
                color: #fff;
                background-color: #000;
            }
            50%{
                color: #000;
                background-color: #fff;
            }
            100%{
                color: #fff;
                background-color: #000;           
            }
        }
        @keyframes rainbow{
            0%{
                background-position:0%
            }
            50%{
                background-position:400%
            }
            100%{
                background-position:800%
            }
        }
        @keyframes Black_and_white{
            0%{
                background-position:0%
            }
            50%{
                background-position:100%
            }
            100%{
                background-position:0%
            }
        }/*css可增加(但不可減)*/

        /* 擴充計算機專用樣式 */
        .keypad {
            display: grid;
            grid-template-columns: repeat(5, 80px);
            gap: 12px;
            justify-content: center;
            padding: 10px;
        }
        .keypad button {
            font-size: 26px;
            height: 80px;
            cursor: pointer;
            background-color: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 8px;
        }
        input#display {
            width: calc(100% - 40px);
            max-width: 440px;
            height: 50px;
            font-size: 28px;
            text-align: right;
            padding: 5px 12px;
            box-sizing: border-box;
            background-color: #222;
            color: white;
            border: 1px solid #555;
            border-radius: 8px;
            margin: 12px auto;
            outline: none;
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <b>歡迎來到rvrv3210網站<img src="game/loge.jpg"></b>      
    </header>
    <nav>
        <a href="index.html"><button>首頁</button></a><a href="settings.html"><button>設定</button></a><button style="color: #fff;">測試</button><a href="renew.html"><button>更新日誌</button></a>
    <br>
    </nav>
    <main>
        <h2 id="homepage">計算機</h2>
        <div>
            <!-- 輸入框：移除 readonly 允許點擊定位游標；使用 inputmode="none" 避免手機跳出虛擬鍵盤 -->
            <input type="text" placeholder="0" id="display" inputmode="none">
            
            <div class="keypad">
                <button onclick="press('1')">1</button> 
                <button onclick="press('2')">2</button> 
                <button onclick="press('3')">3</button> 
                <button onclick="press('+')">+</button>
                <button onclick="pressCustomRoot()">ⁿ√x</button>

                <button onclick="press('4')">4</button> 
                <button onclick="press('5')">5</button> 
                <button onclick="press('6')">6</button> 
                <button onclick="press('-')">-</button>
                <button onclick="press('**')">xʸ</button>

                <button onclick="press('7')">7</button> 
                <button onclick="press('8')">8</button> 
                <button onclick="press('9')">9</button> 
                <button onclick="press('*')">*(x)</button>
                <button onclick="toggleSignAtCursor()">±</button>
                
                <button onclick="press('.')">.</button> 
                <button onclick="press('0')">0</button> 
                <button onclick="backspace()">⌫</button> 
                <button onclick="press('/')">/(÷)</button>
                <button onclick="press('(')">(</button>

                <button onclick="clearAll()">C</button> 
                <button onclick="ster()">=</button> 
                <button onclick="percent()">%</button> 
                <button onclick="teaching()">教學</button>
                <button onclick="press(')')">)</button>
            </div>
        </div>
        <h2>我的其他連結</h2> 
    </main>
    <footer>
        <a href="https://www.youtube.com/channel/UCGQrk3LofChvqrj4Y7XpYYw" target="_blank"><button>前往我的yt</button></a>
    </footer>

    <script>
        const inputField = document.getElementById('display');

        // 在游標當前位置插入內容
        function insertAtCursor(text) {
            const start = inputField.selectionStart ?? inputField.value.length;
            const end = inputField.selectionEnd ?? inputField.value.length;
            const val = inputField.value;

            inputField.value = val.slice(0, start) + text + val.slice(end);
            const newPos = start + text.length;
            inputField.setSelectionRange(newPos, newPos);
            inputField.focus();
        }

        function press(value) {
            insertAtCursor(value);
        }

        // 刪除游標前一個字元
        function backspace() {
            const start = inputField.selectionStart;
            const end = inputField.selectionEnd;
            if (start === null) return;

            const val = inputField.value;
            if (start !== end) {
                inputField.value = val.slice(0, start) + val.slice(end);
                inputField.setSelectionRange(start, start);
            } else if (start > 0) {
                inputField.value = val.slice(0, start - 1) + val.slice(start);
                inputField.setSelectionRange(start - 1, start - 1);
            }
            inputField.focus();
        }

        function clearAll() {
            inputField.value = '';
            inputField.focus();
        }

        // 自訂開根號：輸入 √(
        function pressCustomRoot() {
            insertAtCursor('√(');
        }

        // 依據游標位置精確切換 ± 正負號
        function toggleSignAtCursor() {
            let val = inputField.value;
            let pos = inputField.selectionStart ?? val.length;

            const leftPart = val.slice(0, pos);
            const rightPart = val.slice(pos);

            const parenNegMatch = leftPart.match(/\(-(\d+\.?\d*)$/);
            if (parenNegMatch && rightPart.startsWith(')')) {
                const num = parenNegMatch[1];
                const newLeft = leftPart.slice(0, leftPart.length - parenNegMatch[0].length) + num;
                const newRight = rightPart.slice(1);
                inputField.value = newLeft + newRight;
                const newPos = newLeft.length;
                inputField.setSelectionRange(newPos, newPos);
                inputField.focus();
                return;
            }

            const numMatch = leftPart.match(/(\d+\.?\d*)$/);
            if (numMatch) {
                const num = numMatch[1];
                const newLeft = leftPart.slice(0, leftPart.length - num.length) + `(-${num})`;
                inputField.value = newLeft + rightPart;
                const newPos = newLeft.length - 1; 
                inputField.setSelectionRange(newPos, newPos);
                inputField.focus();
                return;
            }

            insertAtCursor('(-');
        }

        // 解析算式 (包含根號處理)
        function parseExpression(expr) {
            let parsed = expr.replace(/(\d+)?√\(([^)]+)\)/g, (match, root, num) => {
                const r = root ? root : '2';
                return `((${num})**(1/${r}))`;
            });
            return parsed;
        }

        function ster() {
            if (!inputField.value) return;
            try {
                const parsedExpr = parseExpression(inputField.value);
                const result = new Function(`return ${parsedExpr}`)();
                if (result === undefined || !isFinite(result)) {
                    inputField.value = 'Error';
                } else {
                    inputField.value = result;
                }
            } catch (error) {
                inputField.value = 'Error';
            }
        }

        function percent() {
            if (!inputField.value) return;
            try {
                const parsedExpr = parseExpression(inputField.value);
                const result = new Function(`return ${parsedExpr}`)();
                if (isFinite(result)) {
                    inputField.value = result / 100;
                } else {
                    inputField.value = 'Error';
                }
            } catch {
                inputField.value = 'Error';
            }
        }

        function teaching() {
            alert("進入教學模式囉");
            alert("因為是js寫的，因此會稍不同。");
            alert("按了xʸ，會出現**(這是正常現象，ʸ打在**後。)");
            alert("要再數字後按了±(有效)，+變-,-變+。)");
        }
    </script>
</body>
</html>
