<body>
    <header>
        <b>歡迎來到rvrv3210網站<img src="https://musicgrc3520-star.github.io/rvrv3210-1/loge.jpg"></b>      
    </header>

        <a href="index.html"><button>首頁</button></a><a href="settings.html"><button>設定</button></a><a><button style="color: #fff;">測試</button></a><a href="renew.html"><button>更新日誌</button></a>

    <main>
    <h2 id="homepage">測試</h2>
    <br>
    <select id="mySelect">
        <option value="apple">蘋果</option>
        <option value="banana">香蕉</option>
    </select>
    <br>
    <button onclick="addOption()">新增</button>
    新增選項<input type="text" id="nameInput">
    <button onclick="movere()">清空</button>
    刪除選項(輸入數字)<input type="number" id="numberInput">
    <button onclick="Clear()">全部清空</button>
    <button onclick="saveOptions()">儲存</button>
    <button onclick="localStorage2()">加載</button>
    <br>
    儲存文字<textarea placeholder="" id="textinput"></textarea>
    <br>
    <button onclick="text()">上次儲存</button>
    <button onclick="Stora()">儲存</button>
    <br>
    <h2 id=title>這是一段文字</h2>
    <button onclick="Show_Hide()" id="button1">隱藏</button>
    <br>
    <progress id="progress1" value="0" max="100"></progress>
    最大值進度條<input type="text" id="max1">
    <button onclick="max1()">確定</button>
    <button onclick="addProgress()">進度條</button>
    <select id="Select1">
        <option value="Show">增加</option>
        <option value="Hide">減少</option>
    </select>
    <h2 id="text1">0</h2>
    <br>
    <input type="color" id="color1">
    <button></button>
    <script>
    let select = document.getElementById("mySelect");
    function addOption(){
        let value = document.getElementById("nameInput").value;
        let option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
    }
    function Clear(){
        select.innerHTML = "";
    }
    function movere(){
        let number = Number(document.getElementById("numberInput").value);
        if(number >= 1 && number <= select.options.length){
            select.remove(number - 1);
        }
        else{
            alert("喔喔，沒這選項!");
        }
    }
    function Stora(){
        let local = document.getElementById("textinput").value;
        console.log(local);
        localStorage.setItem("name", local);
    }
    function text(){
        let name = localStorage.getItem("name");
        console.log(name);
        document.getElementById("textinput").value = name;
    }
    function saveOptions(){
        let data = [];
        for(let option of select.options){
            data.push({
                value: option.value,
                text: option.textContent
            });
        }
        localStorage.setItem(
            "options",
            //轉成json
            JSON.stringify(data)
        );
    }
    function localStorage2(){
        let data = localStorage.getItem("options");
        if(data === null){
            alert("目前沒有儲存的選項!");
            return;
        }
        //JSON.parse():讀取
        data = JSON.parse(data);
        select.innerHTML = "";
        for(let item of data){
            let option = document.createElement("option");
            option.value = item.value;
            option.textContent = item.text;
            select.appendChild(option);
        }
    }
    function Show_Hide(){
        let title = document.getElementById("title");
        let button1 = document.getElementById("button1");
        //偵測顯示/隱藏
        if(title.style.display == "none"){
            title.style.display = "block"
            button1.textContent = "隱藏"
        }
        else{
            title.style.display = "none"
            button1.textContent = "顯示"
        }
    }
    function addProgress(){
        let select1 = document.getElementById("Select1");
        let progress = document.getElementById("progress1");
        let text = document.getElementById("text1");
        //偵測select1的選項
        if(select1.value == "Show"){
            progress.value = Math.min(progress.value +10 , progress.max);
        }
        else{
            progress.value = Math.max(progress.value -10 , 0);
        }
        text.textContent = progress.value;
    }
    function max1(){
        let progress = document.getElementById("progress1");
        let max = Number(document.getElementById("max1").value);
        progress.max = max;
    }

     // 設定=
    // 比較==
    // 嚴格比較=== 
    </script>
